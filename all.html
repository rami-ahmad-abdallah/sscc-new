<!DOCTYPE html>
<html lang="en" dir="ltr">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Home | Scientific Systems Construction Company</title>
    <link rel="shortcut icon" href="files/logo/icon-square.png" type="image/x-icon">

    <link rel="stylesheet" href="./css/index.css" />

    <!-- SIMPLEBAR CODE -->
    <link rel="stylesheet" href="https://unpkg.com/simplebar@6.3.3/dist/simplebar.css" />
    <script src="https://unpkg.com/simplebar@6.3.3/dist/simplebar.min.js"></script>
</head>

<body>
    <div class="simple-scroll">
        <section class="x-sections">
            <div class="x-section">1</div>
            <div class="x-section">2</div>
            <div class="x-section">3</div>
            <div class="x-section">4</div>
            <div class="x-section">5</div>
        </section>
    </div>


    <section class="y-sections">
        <div class="y-section">1</div>
        <div class="y-section">2</div>
        <div class="y-section">3</div>
    </section>

    <script>
        Array.prototype.forEach.call(
            document.querySelectorAll('.simple-scroll'),
            (el) => new SimpleBar(el)
        );
    </script>
</body>

</html>
