<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Home | Scientific Systems Construction Company</title>
    <link rel="shortcut icon" href="files/logo/icon-square.png" type="image/x-icon">
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.1/dist/gsap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.1/dist/ScrollTrigger.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.1/dist/ScrollSmoother.min.js"></script>

    <style>
        .margin-top {
            margin-top: 110vh;
        }
    </style>

</head>

<body>

    <h2 class="pop-up margin-top">Text that pop-up</h2>


    <script>
        gsap.registerPlugin(ScrollSmoother)
        gsap.registerPlugin(ScrollTrigger);
        ScrollSmoother.create({
            smooth: 1,
            effects: true
        });
        gsap.to('.pop-up', {
            scrollTrigger: '.pop-up', // start animation when ".box" enters the viewport
            x: 500
        });
    </script>
</body>

</html>
