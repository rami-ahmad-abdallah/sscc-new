<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    .item {
        position: relative;
        overflow: hidden;
        height: 500px;
        display: flex;
        justify-content: center;
        align-items: center;
    }

    .bg {
        position: absolute;
        inset: 0;
        object-fit: cover;
        filter: blur(10px) brightness(0.6);
        transform: scale(1.2);
        z-index: 0;
        height: 100%;
        width: 100%;
    }

    .fg {
        position: relative;
        width: 80%;
        height: 80%;
        object-fit: cover;
        z-index: 1;
    }
</style>

<body>
    <div class="item">
        <video class="bg" muted loop playsinline></video>
        <video class="fg" muted loop playsinline></video>
    </div>

    <script>
        const fg = document.querySelector('.fg')
        const bg = document.querySelector('.bg')

        fg.src = './files/videos/sscc-construction.mp4';
        fg.preload = 'none';

        fg.addEventListener('loadeddata', () => {
            if (fg.captureStream) {
                bg.srcObject = fg.captureStream();
                bg.play();
            } else {
                // fallback: use static blurred poster for background
                bg.poster = './files/posters/sscc-construction-blur.webp'
            }
        });

        fg.play();

    </script>
</body>

</html>
